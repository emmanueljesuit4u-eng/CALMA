<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09080a" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var activeFetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>CliGraph</title>
    <meta name="description" content="CliGraph — charts and clinical insights in one mobile app." />
    <meta name="author" content="CliGraph" />
    <meta property="og:title" content="CliGraph" />
    <meta property="og:description" content="CliGraph — charts and clinical insights in one mobile app." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/assets/cligraph-lion.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
